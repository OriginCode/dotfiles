config_version: 2
settings:
  aliases:
    global:
      Zotero: hint links userscript zotero
      json: spawn --userscript format_json
      q: close
      qa: quit
      w: session-save
      wq: quit --save
      wqa: quit --save
      zotero: spawn --userscript zotero
  auto_save.session:
    global: true
  bindings.commands:
    global:
      insert:
        <Escape>: mode-leave ;; jseval -q document.activeElement.blur()
      normal:
        <Alt+1>: tab-focus 1
        <Meta+1>: tab-focus 1
        <Meta+2>: tab-focus 2
        <Meta+3>: tab-focus 3
        <Meta+4>: tab-focus 4
        <Meta+5>: tab-focus 5
        <Meta+6>: tab-focus 6
        <Meta+7>: tab-focus 7
        <Meta+8>: tab-focus 8
        <Meta+9>: tab-focus -1
  colors.webpage.darkmode.enabled:
    global: false
  colors.webpage.preferred_color_scheme:
    global: dark
  content.blocking.enabled:
    global: true
  content.cookies.accept:
    global: all
  content.desktop_capture:
    https://meet.edison.network: true
  content.geolocation:
    https://amap.com: true
    https://map.baidu.com: true
    https://openweathermap.org: true
    https://wplace.live: true
    https://www.bestbuy.ca: true
    https://www.genelec.com: true
    https://www.google.com: true
    https://www.speedtest.net: true
    https://www.td.com: true
  content.headers.user_agent:
    global: Mozilla/5.0 ({os_info}) AppleWebKit/{webkit_version} (KHTML, like Gecko)
      {upstream_browser_key}/{upstream_browser_version_short} Safari/{webkit_version}
  content.javascript.clipboard:
    https://1sfu-my.sharepoint.com: access-paste
    https://aistudio.google.com: access-paste
    https://anime-sedai.egoist.dev: access-paste
