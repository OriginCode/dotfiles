  content.proxy:
    global: system
  content.register_protocol_handler:
    https://calendar.google.com?cid=%25s: true
    https://outlook.office.com?mailtouri=%25s: false
  fileselect.folder.command:
    global:
    - foot
    - yazi
    - --chooser-file
    - '{}'
  fileselect.handler:
    global: external
  fileselect.multiple_files.command:
    global:
    - foot
    - yazi
    - --chooser-file
    - '{}'
  fileselect.single_file.command:
    global:
    - foot
    - yazi
    - --chooser-file
    - '{}'
  fonts.default_family:
    global: M+CodeLat50 Nerd Font Propo
  fonts.default_size:
    global: 12pt
  fonts.web.family.fixed:
    global: M+CodeLat50 Nerd Font Mono
  fonts.web.size.default_fixed:
    global: 16
  hints.border:
    global: '1px solid #E3BE23'
  input.mode_override:
    global: null
  statusbar.position:
    global: bottom
  tabs.max_width:
    global: -1
  tabs.position:
    global: left
  tabs.width:
    global: 10%
  url.default_page:
    global: https://google.com/
  url.searchengines:
    global:
      DEFAULT: https://google.com/search?q={}
  url.start_pages:
    global: https://google.com
