<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'urn:fontconfig:fonts.dtd'>
<fontconfig>
 <match target="font">
  <edit name="antialias" mode="assign">
   <bool>true</bool>
  </edit>
  <edit name="embeddedbitmap" mode="assign">
   <bool>false</bool>
  </edit>
  <edit name="hinting" mode="assign">
   <bool>true</bool>
  </edit>
  <edit name="hintstyle" mode="assign">
   <const>hintnone</const>
  </edit>
  <edit name="lcdfilter" mode="assign">
   <const>lcddefault</const>
  </edit>
  <edit name="rgba" mode="assign">
   <const>rgb</const>
  </edit>
 </match>
 <!-- Set hinting for emoji fonts -->
 <match target="font">
  <test name="family" compare="contains">
   <string>Emoji</string>
  </test>
  <edit name="hinting" mode="assign">
   <bool>true</bool>
  </edit>
  <edit name="hintstyle" mode="assign">
   <const>hintslight</const>
  </edit>
  <edit name="embeddedbitmap" mode="assign">
   <bool>true</bool>
  </edit>
 </match>
 <!-- Default serif font -->
 <alias binding="strong">
  <family>serif</family>
  <prefer>
   <family>Noto Serif Nerd Font</family>
  </prefer>
 </alias>
 <!-- Default sans-serif font -->
 <alias binding="strong">
  <family>sans-serif</family>
  <prefer>
   <family>Ubuntu Nerd Font</family>
   <family>Noto Sans Nerd Font</family>
  </prefer>
 </alias>
 <!-- Default monospace font -->
 <alias binding="strong">
  <family>monospace</family>
  <prefer>
   <family>Iosevka Nerd Font Propo</family>
  </prefer>
 </alias>
 <!-- Default system-ui font -->
 <alias binding="strong">
  <family>system-ui</family>
  <prefer>
   <family>Ubuntu Nerd Font</family>
   <family>Noto Sans Nerd Font</family>
  </prefer>
 </alias>
 <!-- Serif CJK -->
 <!-- Default serif when the "lang" attribute is not given -->
 <!-- You can change this font to the language variant you want -->
 <match target="pattern">
  <test name="family">
   <string>serif</string>
  </test>
  <edit name="family" mode="append" binding="strong">
   <string>Noto Serif</string>
  </edit>
 </match>
 <!-- Japanese -->
 <!-- "lang=ja" or "lang=ja-*" -->
 <match target="pattern">
  <test name="lang" compare="contains">
   <string>ja</string>
  </test>
  <test name="family">
   <string>serif</string>
  </test>
  <edit name="family" mode="append" binding="strong">
   <string>Noto Serif CJK JP</string>
  </edit>
 </match>
 <!-- Korean -->
 <!-- "lang=ko" or "lang=ko-*" -->
 <match target="pattern">
  <test name="lang" compare="contains">
   <string>ko</string>
  </test>
  <test name="family">
   <string>serif</string>
  </test>
  <edit name="family" mode="append" binding="strong">
   <string>Noto Serif CJK KR</string>
  </edit>
 </match>
